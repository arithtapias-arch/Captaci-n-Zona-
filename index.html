<style>

.btn:hover{border-color:var(--mute)}.btn.p{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}.btn.wa{background:var(--green-s);color:var(--green);border-color:transparent}.btn.s{padding:6px 11px;font-size:13px}.btn.d{color:var(--red)}

@media(max-width:820px){#app{display:block}nav{position:fixed;inset:auto 0 0;height:auto;flex-direction:row;border:0;border-top:1px solid var(--line);background:var(--card);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20;gap:0}nav .logo,nav .sync{display:none}nav button{flex:1;flex-direction:column;gap:2px;font-size:10px;padding:7px 0;min-width:0}nav .badge{position:absolute;top:1px;right:calc(50% - 22px);font-size:9px;padding:0 5px}main{padding:18px 16px 110px}.cols{grid-template-columns:minmax(0,1fr)}.form label{grid-column:span 6}.form .w2{grid-column:span 2}.form .w3{grid-column:span 3}h1{font-size:23px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="login" hidden><form class="card" id="loginForm"><h1>Hola de nuevo</h1><p class="mute">Entra con el mismo email y contraseña de siempre.</p>

<script>
'use strict';
/* Misma base de datos y mismas colecciones que la versión anterior. */
const firebaseConfig={apiKey:"AIzaSyCqLslzaYONrp0aCzcVInlDniixgZPXlJM",authDomain:"captacionzona.firebaseapp.com",projectId:"captacionzona",storageBucket:"captacionzona.firebasestorage.app",messagingSenderId:"437136598052",appId:"1:437136598052:web:6a674afb52e6c4792fa4b1"};
const DEMO=new URLSearchParams(location.search).has('demo');
let me={uid:'',nombre:'',rol:''},team=[];
const PUB=['alias','direccion','municipio','zona','tipo','tipoCaptacion','captadoPor','precio','habitaciones','banos','m2','m2Parcela','planta','extras','certificado','urlAnuncio','portada','descripcion','estado','captadoEn','vendidaEn','fecha','fechaISO','createdAt','ownerUid','ownerNombre','compartida'];
const isAdmin=()=>me.rol==='admin';
const can=(k,r)=>isAdmin()||r.ownerUid===me.uid;
const ownerName=r=>team.find(t=>t.id===r.ownerUid)?.nombre||r.ownerNombre||'Sin asignar';
// Datos con los que se trabaja: los propios o, si es administrador, los de la persona elegida.
const scope=()=>isAdmin()?ui.persona:me.uid;
const L=k=>{const o=scope();return o?S[k].filter(r=>o==='-'?!r.ownerUid:r.ownerUid===o):S[k]};
const split=d=>{const pub={},priv={};for(const f in d)if(f!=='id')(PUB.includes(f)?pub:priv)[f]=d[f];return[pub,priv]};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const p2=n=>String(n).padStart(2,'0');
const iso=(d=new Date())=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const addDays=(n,b=new Date())=>{const d=new Date(b);d.setDate(d.getDate()+n);return d};
const fmt=s=>s?s.split('-').reverse().join('/'):'';
const when=ts=>new Date(ts).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const days=ts=>ts?Math.floor((Date.now()-ts)/864e5):null;
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const uid=k=>({fichas:'e',leads:'l',viviendas:'v'})[k]+Date.now()+Math.random().toString(36).slice(2,7);
const plural=(n,a,b=a+'s')=>`${n} ${n===1?a:b}`;
const euro=n=>n.toLocaleString('es-ES',{useGrouping:true})+' €';

let S={fichas:[],leads:[],viviendas:[]},loaded={},pending={},syncErr='',unsubs=[],db=null,auth=null;
let view='hoy',ui={cap:'lista',cli:'activos',cliModo:'lista',prop:'activas',zona:'',fe:'',fz:'',hoyN:8,week:0,interes:'',persona:''};
const E={
 fichas:{pendiente:['Pendiente',''],'no-en-casa':['No en casa','amber'],interesado:['Interesado','green'],'no-interesado':['No interesado','red'],volver:['Volver a visitar','blue'],captado:['Captado','purple']},
 leads:{nuevo:['Nuevo',''],contactado:['Contactado','blue'],visita:['Visita agendada','amber'],oferta:['Oferta presentada','purple'],cerrado:['Cerrado','green'],seguimiento:['Seguimiento futuro','blue'],descartado:['Descartado','red']},
 viviendas:{'en-venta':['En venta','blue'],reservada:['Reservada','amber'],vendida:['Vendida','green'],retirada:['Retirada','red'],alquiler:['En alquiler','blue'],alquilado:['Alquilada','green']}};
const VEND={visita:'Valoración agendada',oferta:'Propuesta presentada',cerrado:'Captado'};
const isV=l=>l.tipoLead==='vendedor', sells=l=>l.tipoLead==='vendedor'||l.tipoLead==='ambos';
const label=(k,r)=>k==='leads'&&isV(r)&&VEND[r.estado]||E[k][r.estado]?.[0]||'Sin estado';
const tag=(k,r)=>`<span class="tag ${E[k][r.estado]?.[1]||''}">${esc(label(k,r))}</span>`;
const dateF={fichas:['recordatorio','recordatorioHora'],leads:['cita','citaHora'],viviendas:['proximaAccion','proximaHora']};
const get=(k,id)=>S[k].find(x=>x.id===id);
const name=(k,r)=>k==='leads'?[r.nombre,r.apellidos].filter(Boolean).join(' '):k==='viviendas'?(r.alias||r.direccion||'Propiedad'):(r.nombre||[r.calle,r.numero].filter(Boolean).join(', ')||'Ficha');
const addr=r=>[r.calle,r.numero,r.piso&&r.piso+'º',r.puerta].filter(Boolean).join(', ');
const phone=(k,r)=>k==='viviendas'?r.propietarioTelefono:r.telefono;
function tel(p){let n=String(p||'').replace(/[^\d+]/g,'').replace(/^00/,'+');if(n[0]==='+')n=n.slice(1);else if(n.length===9)n='34'+n;return n.length>=10?n:''}
const samePhone=(a,b)=>!!tel(a)&&tel(a)===tel(b);
const interactions=r=>(r.notasSeguimiento||[]).filter(n=>n.tipo!=='nota');
const lastTouch=r=>Math.max(r.createdAt||0,...interactions(r).map(n=>n.ts||0),...(r.historialEstados||[]).map(n=>n.ts||0));
const isOpen=(k,r)=>!r.noContactar&&(k==='fichas'?!['no-interesado','captado'].includes(r.estado):k==='leads'?!['cerrado','descartado'].includes(r.estado):['en-venta','reservada','alquiler'].includes(r.estado));

/* ---------- Ajustes de este dispositivo ---------- */
const T0=[
 {id:'seg',n:'Retomar contacto',es:'Hola{nombre}, soy {yo}, asesor inmobiliario. ¿Cómo va todo? Te escribo para saber en qué momento estás y si puedo ayudarte en algo.',ca:'Hola{nombre}, sóc {yo}, assessor immobiliari. Com va tot? T’escric per saber en quin moment estàs i si et puc ajudar en alguna cosa.'},
 {id:'com',n:'Filtrar comprador',es:'Hola{nombre}, soy {yo}. Para ayudarte mejor: ¿estás empezando o ya estás visitando viviendas? ¿Qué zona y presupuesto tienes en mente? ¿Ya cuentas con un estudio financiero?',ca:'Hola{nombre}, sóc {yo}. Per ajudar-te millor: estàs començant o ja visites habitatges? Quina zona i pressupost tens en ment? Ja tens un estudi financer?'},
 {id:'ven',n:'Filtrar vendedor',es:'Hola{nombre}, soy {yo}. Para orientarte bien: ¿qué propiedad tienes y en qué población o urbanización está? ¿Hace cuánto piensas en vender y cuál es el motivo? También necesitaría tu nombre y apellido, teléfono y correo.',ca:'Hola{nombre}, sóc {yo}. Per orientar-te bé: quina propietat tens i a quina població o urbanització és? Quant fa que penses a vendre i quin n’és el motiu? També necessitaria el teu nom i cognom, telèfon i correu.'},
 {id:'cita',n:'Confirmar cita',es:'Hola{nombre}, soy {yo}. Te escribo para confirmar nuestra cita{cita}. ¿Te sigue yendo bien?',ca:'Hola{nombre}, sóc {yo}. T’escric per confirmar la nostra cita{cita}. Et continua anant bé?'},
 {id:'prop',n:'Enviar propiedad',es:'Hola{nombre}, soy {yo}. Te comparto esta propiedad: {propiedad}. ¿Te gustaría visitarla?',ca:'Hola{nombre}, sóc {yo}. Et comparteixo aquesta propietat: {propiedad}. T’agradaria visitar-la?'},
 {id:'own',n:'Informar al propietario',es:'Hola{nombre}, soy {yo}. Me gustaría ponerte al día sobre tu propiedad. ¿Cuándo te va bien que hablemos?',ca:'Hola{nombre}, sóc {yo}. M’agradaria posar-te al dia sobre la teva propietat. Quan et va bé que parlem?'}];
let cfg={cap:2,ven:1,dias:{},theme:'',plantillas:{}};
try{cfg={...cfg,...JSON.parse(localStorage.getItem('crm_cfg')||'{}')}}catch(e){}
const saveCfg=()=>{try{localStorage.setItem('crm_cfg_'+me.uid,JSON.stringify(cfg))}catch(e){}};
const loadCfg=()=>{try{const x=localStorage.getItem('crm_cfg_'+me.uid)||localStorage.getItem('crm_cfg');if(x)cfg={...cfg,...JSON.parse(x)}}catch(e){}theme();ui.persona=cfg.persona||''};
const theme=()=>{document.documentElement.dataset.theme=cfg.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')};theme();

/* ---------- Datos ---------- */
async function save(k,id,data,push={}){
 const r=get(k,id);let d={...data};
 if(r&&!can(k,r)){toast('Solo puede cambiarlo su responsable');return false}
 if(!r){if(!isAdmin()||!d.ownerUid){d.ownerUid=me.uid;d.ownerNombre=me.nombre}}
 if(DEMO){let x=r;if(!x){x={id};S[k].unshift(x)}Object.assign(x,d,k==='viviendas'?{compartida:true}:{});for(const f in push)x[f]=[...(x[f]||[]),push[f]];render();return true}
 for(const f in push)d[f]=firebase.firestore.FieldValue.arrayUnion(push[f]);
 try{
  if(k!=='viviendas')await db.collection(k).doc(id).set(d,{merge:true});
  else{
   if(r&&r.compartida!==true){toast('Primero prepara las propiedades en Metas → Equipo');return false}
   const owner=d.ownerUid??r?.ownerUid??'',[pub,priv]=split(d),b=db.batch();
   if(!r||Object.keys(pub).length)b.set(db.collection(k).doc(id),{...pub,ownerUid:owner,compartida:true},{merge:true});
   if(!r||Object.keys(priv).length||pub.ownerUid!==undefined)b.set(db.collection('viviendasPriv').doc(id),{...priv,ownerUid:owner},{merge:true});
   await b.commit();
  }
  return true;
 }catch(e){console.error(e);syncErr='No se pudo guardar';nav();toast('No se pudo guardar. Revisa tu conexión o tus permisos.');return false}
}
async function remove(k,id){if(DEMO){S[k]=S[k].filter(x=>x.id!==id);render();return true}
 try{if(k==='viviendas')await deleteFotos(id);const b=db.batch();b.delete(db.collection(k).doc(id));if(k==='viviendas'&&raw.viviendasPriv.some(x=>x.id===id))b.delete(db.collection('viviendasPriv').doc(id));await b.commit();return true}catch(e){console.error(e);toast('No se pudo eliminar.');return false}}
let raw={viviendas:[],viviendasPriv:[]};
function start(){
 stop();for(const k of ['fichas','leads','viviendas','viviendasPriv']){
  let q=db.collection(k);if(!isAdmin())q=k==='viviendas'?q.where('compartida','==',true):q.where('ownerUid','==',me.uid);
  unsubs.push(q.onSnapshot({includeMetadataChanges:true},s=>{
   const rows=s.docs.map(d=>({...d.data(),id:d.id})),sort=a=>a.sort((x,y)=>(y.createdAt||0)-(x.createdAt||0));
   if(raw[k]){raw[k]=rows;const pv=new Map(raw.viviendasPriv.map(x=>[x.id,x]));S.viviendas=sort(raw.viviendas.map(v=>({...pv.get(v.id),...v})))}else S[k]=sort(rows);
   loaded[k]=true;pending[k]=s.metadata.hasPendingWrites||s.metadata.fromCache;syncErr='';render();

document.addEventListener('change',e=>{const t=e.target;if(t.id==='pf')addFotos(t.files);if(t.matches('[data-move]'))setEstado(t.dataset.k,t.dataset.id,t.value);if(t.dataset.uisel){ui[t.dataset.uisel]=t.value;draw()}if(t.id==='persona'){ui.persona=cfg.persona=t.value;saveCfg();draw()}if(t.dataset.rol){const u=team.find(x=>x.id===t.dataset.rol),n=t.value;if(!confirm(`${u.nombre} (${u.email}) pasará a: ${ROL[n]}. ¿Continuar?`)){t.value=u.rol;return}if(DEMO){u.rol=n;draw()}else db.collection('usuarios').doc(u.id).update({rol:n}).then(()=>toast('Acceso actualizado')).catch(x=>{console.error(x);t.value=u.rol;toast('No se pudo cambiar')})}if(t.id==='wt'||t.id==='wl')waFill()});
let drag=null;document.addEventListener('dragstart',e=>{const c=e.target.closest?.('[draggable]');if(c)drag={...c.dataset}});
document.addEventListener('dragover',e=>{const c=e.target.closest('[data-drop]');if(c&&drag){e.preventDefault();c.classList.add('over')}});
document.addEventListener('dragleave',e=>e.target.closest?.('[data-drop]')?.classList.remove('over'));
document.addEventListener('drop',e=>{const c=e.target.closest('[data-drop]');if(c&&drag&&c.dataset.dk===drag.k){e.preventDefault();c.classList.remove('over');setEstado(drag.k,drag.id,c.dataset.drop)}drag=null});
$('q').addEventListener('input',draw);

/* ---------- Arranque ---------- */
if(DEMO){
 const ago=n=>Date.now()-n*864e5,dt=n=>iso(addDays(n));$('app').hidden=false;$('demo').hidden=false;
 S.viviendas=[{id:'v1',alias:'Piso demo A',direccion:'Calle Ejemplo, 1',municipio:'Barcelona - La Sagrera',tipo:'Piso',precio:'240.000 €',habitaciones:'3',m2:'80',estado:'en-venta',tipoCaptacion:'Exclusiva',propietarioNombre:'Propietario Demo',createdAt:ago(20),captadoEn:dt(-20),fechaISO:dt(-20)},{id:'v2',direccion:'Casa Ejemplo, 2',municipio:'Abrera',tipo:'Casa/Chalet',precio:'390.000 €',habitaciones:'4',estado:'en-venta',createdAt:ago(5),captadoEn:dt(-5),fechaISO:dt(-5)}];
 S.leads=[{id:'l1',nombre:'Cliente Demo 1',telefono:'600000001',estado:'nuevo',origen:'Instagram',createdAt:ago(1)},{id:'l2',nombre:'Cliente Demo 2',telefono:'600000002',estado:'oferta',presupuesto:'220.000 - 250.000 €',financiacion:'Aprobado',momento:'Ya busca activamente',zonasInteres:'La Sagrera',createdAt:ago(12)},{id:'l3',tipoLead:'vendedor',nombre:'Vendedor Demo',telefono:'600000003',estado:'contactado',inmuebleVenta:'Casa con jardín',poblacionVenta:'Abrera',motivo:'Herencia',plazo:'1-3 meses',createdAt:ago(8)},{id:'l4',nombre:'<b>Prueba</b>',estado:'visita',cita:dt(0),citaHora:'17:00',createdAt:ago(3)},{id:'l5',nombre:'Cliente Demo 5',estado:'seguimiento',createdAt:ago(40)}];
 S.fichas=[{id:'e1',nombre:'Vecino Demo',calle:'Calle Ficticia',numero:'12',municipio:'Martorell',estado:'interesado',telefono:'600000004',motivo:'Vender para comprar',createdAt:ago(4),fechaISO:dt(-4)},{id:'e2',calle:'Calle Ficticia',numero:'14',municipio:'Martorell',estado:'no-en-casa',createdAt:ago(6)},{id:'e3',calle:'Calle Inventada',numero:'3',municipio:'Barcelona - La Sagrera',estado:'volver',recordatorio:dt(-2),createdAt:ago(10)},{id:'e4',calle:'Calle Inventada',numero:'5',municipio:'Barcelona - La Sagrera',estado:'captado',captadoEn:dt(0),createdAt:ago(1)}];
 const rolDemo=new URLSearchParams(location.search).get('demo')==='agente'?'agente':'admin';
 for(const k in S)S[k].forEach((r,i)=>{r.ownerUid=i%2?'u2':'u1';r.ownerNombre=i%2?'Asesor Demo':'Admin Demo';if(k==='viviendas')r.compartida=true});
 if(rolDemo==='agente'){me={uid:'u2',nombre:'Asesor Demo',rol:'agente'};for(const k in S)S[k]=k==='viviendas'?S[k].map(v=>v.ownerUid==='u2'?v:{...split(v)[0],id:v.id}):S[k].filter(r=>r.ownerUid==='u2')}
 else{me={uid:'u1',nombre:'Admin Demo',rol:'admin'};team=[{id:'u1',nombre:'Admin Demo',email:'admin@example.com',rol:'admin'},{id:'u2',nombre:'Asesor Demo',email:'asesor@example.com',rol:'agente'},{id:'u3',nombre:'Nuevo Demo',email:'nuevo@example.com',rol:'pendiente'}]}
 draw();
}else{
 firebase.initializeApp(firebaseConfig);db=firebase.firestore();auth=firebase.auth();
 let offP=null;
 const waiting=h=>{stop();if(dlg.open)close();$('app').hidden=true;$('view').innerHTML='';$('wait').hidden=false;$('wait').style.display='grid';$('wait').innerHTML=`<div class="card" style="width:min(420px,100%)">${h}<div class="row" style="margin-top:14px"><button class="btn" data-a="logout">Salir</button></div></div>`};
 auth.onAuthStateChanged(u=>{
  if(offP)offP();offP=null;stop();me={uid:'',nombre:'',rol:''};if(dlg.open)close();
  $('login').hidden=!!u;$('app').hidden=true;$('wait').hidden=true;$('wait').style.display='';$('view').innerHTML='';$('q').value='';view='hoy';
  if(!u)return;
  offP=db.collection('usuarios').doc(u.uid).onSnapshot(d=>{
   if(!d.exists){if(d.metadata.fromCache)return;waiting(`<h1>Pide tu acceso</h1><p class="mute">Un administrador tiene que aprobarte.</p><label>Nombre y apellido<input id="pn" maxlength="80"></label><button class="btn p" style="margin-top:12px" data-a="pedir">Pedir acceso</button>`);return}
   const x=d.data();
   if(!['admin','agente'].includes(x.rol)){me={uid:'',nombre:'',rol:''};waiting(x.rol==='inactivo'?'<h1>Sin acceso</h1><p>Habla con un administrador.</p>':'<h1>Solicitud enviada</h1><p>Entrarás en cuanto un administrador la apruebe.</p>');return}
   const same=me.uid===u.uid&&me.rol===x.rol;me={uid:u.uid,nombre:x.nombre||u.email,rol:x.rol};
   if(!same){$('wait').hidden=true;$('wait').style.display='';$('app').hidden=false;loadCfg();start()}draw();
  },e=>{console.error(e);me={uid:'',nombre:'',rol:''};waiting('<h1>Acceso no disponible</h1><p>No se pudo comprobar tu permiso. Puede que falte publicar las reglas o que no haya conexión.</p>')});
 }); $('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('lerr').hidden=true;try{await auth.signInWithEmailAndPassword($('le').value.trim(),$('lp').value);$('lp').value=''}catch(x){console.error(x);$('lerr').textContent=x.code==='auth/network-request-failed'?'Sin conexión. Inténtalo de nuevo.':'Email o contraseña incorrectos.';$('lerr').hidden=false}});
}
